<body>
    <script>
    // Theme, applied before any content is laid out, so a saved dark preference
    // never shows a flash of the light theme. Byte-identical to the copy in
    // index.html; scripts/pre-render.js asserts the two match, so this cannot
    // drift. It is inline rather than a shared file on purpose: a blocking
    // external script here would cost every page on the site a round trip.
    window.FOLLOW_SYSTEM_THEME = false;
    (function () {
        try {
            var saved = localStorage.getItem('darkMode');
            var dark = saved === null
                ? (window.FOLLOW_SYSTEM_THEME &&
                   window.matchMedia('(prefers-color-scheme: dark)').matches)
                : saved === 'true';
            if (dark) document.body.classList.add('dark-mode');
        } catch (e) {
            // Storage blocked (private browsing): fall through to the light theme.
        }
        // The body element's style was already resolved as light before this ran,
        // so adding the class here would animate the 0.3s colour transition and
        // the page would visibly fade in from the light theme on every cold load.
        // Suppress transitions until the first frame has been painted.
        document.body.classList.add('theme-booting');
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                document.body.classList.remove('theme-booting');
            });
        });
    })();
    </script>
